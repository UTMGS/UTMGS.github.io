# 画像などのメディアをアップロードする保存先フォルダ
media: assets/images

# 編集対象の設定
content:
  - name: landing_page
    label: トップページ編集
    type: file
    path: index.md # 対象のファイルパス
    fields:
      - name: title
        type: string
        label: ページタイトル
      - name: description
        type: string
        label: 概要（meta description）
      - name: body
        type: rich-text
        label: メイン本文
