backend:
  name: github
  repo: UTMGS/UTMGS.github.io # 例: UTMGS/utmgs.com など
  branch: main
  auth_type: pkce # または implicit (通常は pkce を推奨)

media_folder: "assets/images"
public_folder: "/assets/images"

collections:
  - name: "blog"
    label: "ブログ記事"
    folder: "content/blog"
    create: true
    fields:
      - {label: "タイトル", name: "title", widget: "string"}
      - {label: "本文", name: "body", widget: "markdown"}