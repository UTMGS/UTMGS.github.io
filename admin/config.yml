backend:
  name: git-gateway # もしくは github など環境に合わせて変更
  branch: main

media_folder: "assets/images"
public_folder: "/assets/images"

collections:
  - name: "blog"
    label: "ブログ記事"
    folder: "content/blog"
    create: true
    fields:
      - { label: "タイトル", name: "title", widget: "string" }
      - { label: "本文", name: "body", widget: "markdown" }