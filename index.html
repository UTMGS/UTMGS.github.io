<!DOCTYPE html>
<html lang="ja">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>UTMGS</title>
	<script>
		try {
			const savedTheme = localStorage.getItem("theme");
			if (savedTheme === "light" || savedTheme === "dark") {
				document.documentElement.dataset.theme = savedTheme;
			}
		} catch (error) {
			console.warn("テーマ設定を読み込めませんでした。", error);
		}
	</script>
	<link rel="stylesheet" href="stylesheet.css">
	<link rel="stylesheet" href="social-links.css">
	<link rel="icon" type="image/png" sizes="32x32" href="assets/icons/favicon-32.png">
	<link rel="apple-touch-icon" sizes="180x180" href="assets/icons/apple-touch-icon.png">
</head>

<body>
	<button class="theme-toggle" type="button" aria-pressed="false">
		<span class="theme-toggle__icon" aria-hidden="true">☾</span>
		<span class="theme-toggle__label">Dark mode</span>
	</button>
	<main class="page">
		<img src="assets/brand/logo.jpg" alt="UTMGS ロゴ" class="logo">
		<div class="social-links">
			<a class="social-link" href="https://x.com/UTMGS_SUS" target="_blank" rel="noopener noreferrer">
				<span class="social-link__mark social-link__mark--large" aria-hidden="true">
					<img src="assets/social/x-logo.svg" alt="" class="social-link__logo">
				</span>
				<span class="social-link__copy">
					<span class="social-link__handle">@UTMGS_SUS</span>
				</span>
				<span class="social-link__arrow social-link__arrow--line" aria-hidden="true">&#8594;</span>
			</a>
		</div>
		<section class="acknowledgment" aria-labelledby="acknowledgment-heading">
			<h2 id="acknowledgment-heading">Acknowledgment</h2>

			<div class="acknowledgment__group">
				<h3>UTMGS</h3>
				<ul>
					<li data-type="individual">Sennin</li>
					<li data-type="individual">Dragon</li>
					<li data-type="individual">Kondoyan</li>
					<li data-type="individual">KJ</li>
					<li data-type="individual" hidden>Takagi</li>
					<li data-type="individual" hidden>Kaneyan</li>
					<li data-type="individual">Ryopey-chan</li>
					<li>...and all Yantes.</li>
				</ul>
			</div>
			<div class="acknowledgment__group">
				<h3>JOHN</h3>
				<ul>
					<li data-type="individual">Ryopey-chan</li>
					<li data-type="individual">ShibaYu</li>
					<li data-type="individual">Kubocchi</li>
					<li data-type="individual">Fuji-kun</li>
					<li data-type="individual">Imai-san</li>
					<li data-type="individual">Seki-kun</li>
					<li data-type="individual">Mori-kun</li>
					<li data-type="individual">Okubo-kun</li>
					<li>...and all JOHN Players.</li>
				</ul>
			</div>
		</section>
	</main>
	<script>
		const themeToggle = document.querySelector(".theme-toggle");
		const themeLabel = themeToggle.querySelector(".theme-toggle__label");
		const themeIcon = themeToggle.querySelector(".theme-toggle__icon");

		function updateThemeToggle() {
			const isDark = document.documentElement.dataset.theme
				? document.documentElement.dataset.theme === "dark"
				: window.matchMedia("(prefers-color-scheme: dark)").matches;

			themeToggle.setAttribute("aria-pressed", String(isDark));
			themeLabel.textContent = isDark ? "Light mode" : "Dark mode";
			themeIcon.textContent = isDark ? "☀" : "☾";
		}

		themeToggle.addEventListener("click", () => {
			const nextTheme = themeToggle.getAttribute("aria-pressed") === "true"
				? "light"
				: "dark";
			document.documentElement.dataset.theme = nextTheme;
			updateThemeToggle();

			try {
				localStorage.setItem("theme", nextTheme);
			} catch (error) {
				console.warn("テーマ設定を保存できませんでした。", error);
			}
		});

		updateThemeToggle();
	</script>
</body>

</html>
